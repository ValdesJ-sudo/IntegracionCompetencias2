<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Asistencia</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/formularios.css">
</head>
<body>
    <main class="contenedor-principal">
        <div class="encabezado">
            <h1>Iniciar Sesión</h1>
            <div id="reloj" class="reloj">00:00:00</div>
            <hr>
        </div>

        <form action="/login" method="POST" class="formulario-login">
            <div class="grupo-input">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" class="input-base" required placeholder="usuario@empresa.com">
            </div>
            
            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="input-base" required placeholder="********">
            </div>

            <button type="submit" class="btn btn-entrada">Ingresar</button>
        </form>
    </main>

    <script src="js/reloj.js"></script>
    <script src="js/validaciones.js"></script> 
    <script src="js/login.js"></script> 
</body>
</html>
